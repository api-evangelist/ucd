specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: University College Dublin
providerId: ucd
created: '2026-06-03'
modified: '2026-08-30'
reconciled: false
tags:
- Education
- Higher Education
- University
- Plans
description: >-
  University College Dublin is a non-commercial higher-education institution and sells no API
  product. It operates no API programme at all: no developer portal, no plans, no tiers, no key
  issuance. The public machine-readable surfaces it does run — the Research Repository UCD
  OAI-PMH endpoint and the UCD Digital Library static data exports — are free and keyless with
  no registration of any kind. Its identity surface (the Edugate/eduGAIN Shibboleth IdP) is
  gated by institutional affiliation, which is a membership condition, not a plan.
notes: >-
  No published per-seat or per-call commercial pricing. "Free / Open" reflects open
  public endpoints; "Affiliation / Credentialed" reflects access gated by institutional
  identity rather than payment.
sources:
- https://raw.githubusercontent.com/api-evangelist/ucd/refs/heads/main/apis.yml
plans:
- id: ucd-free-open
  name: Free / Open
  type: free
  description: Public open APIs (metadata, library, repository, course data) offered at no charge, generally for non-commercial use.
  entries:
  - label: Open API Access
    name: open_api_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
- id: ucd-affiliation
  name: Affiliation / Credentialed
  type: free
  description: Administrative and identity APIs gated behind institutional SSO, client certificates, or federation membership rather than payment.
  entries:
  - label: Credentialed Access
    name: credentialed_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
