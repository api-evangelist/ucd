x-coverage:
  state: none
  reason: no_public_api
  detail: >-
    University College Dublin operates no public API programme — no developer
    portal, no API key issuance, no OAuth authorization server, no first-party
    OpenAPI, no llms.txt and no security.txt on any ucd.ie host — and this
    profile now says so. Three institution-operated machine-readable surfaces do
    exist and are catalogued: the OAI-PMH 2.0 harvesting endpoint of Research
    Repository UCD (17,167 records, fourteen metadata formats, OpenAIRE CRIS
    profile), the SAML 2.0 Shibboleth IdP registered in Edugate/eduGAIN, and the
    UCD Digital Library's static Dublin Core data exports. None is a hosted API
    product, and the single OpenAPI in this repository is DERIVED by API
    Evangelist from live probes of the OAI-PMH endpoint, not published by UCD.
    What was catalogued here on 2026-06-03 was a different institution's
    contract: six per-tag OpenAPIs of the Dúchas API, whose info.contact is
    "Gaois / Dúchas" <eolas@duchas.ie> and whose operator is the Gaois research
    group at Dublin City University, all registered under UCD's slug with a
    fabricated baseURL of https://researchrepository.ucd.ie/oai/request — a path
    that returns 405 and does not serve those endpoints. Six times the apparent
    footprint, on a host that does not run the software, for an API its own
    documentation says "is no longer available" and which returns HTTP 500 on
    every path. Those six specifications, their twelve collections, and every
    schema, structure, example, ruleset, vocabulary, JSON-LD context and
    agentic-access file derived from them — 34 files — were removed on
    2026-08-30. Two further June entries described the UCD Digital Library's IIIF
    Image, IIIF Presentation, Geospatial and unAPI endpoints; those were
    decommissioned with the old platform and now 404, and were replaced by the
    static data-export entry. The remaining machinery under UCD's name belongs to
    someone else and is labelled as such: the repository platform is DSpace-CRIS
    7.6.1 hosted by 4Science (researchrepository.ucd.ie CNAMEs to
    ucd7.4science.cloud), and library discovery is Serials Solutions under a
    customer key.
