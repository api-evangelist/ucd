apis:

- aid: ucd:oai-pmh
  name: Research Repository UCD — OAI-PMH 2.0
  x-operator: institution
  x-operator-evidence: >-
    Served from researchrepository.ucd.ie, under UCD's own registrable domain.
    The Identify response names repositoryName "Research Repository UCD",
    repositoryIdentifier researchrepository.ucd.ie and adminEmail
    research.repository@ucd.ie. The host CNAMEs to ucd7.4science.cloud /
    ucd-researchrepository.prod.4science.cloud, so the PLATFORM is hosted by
    4Science — but the OAI repository identity, sets, content and administrative
    contact are UCD's, and OAI-PMH is a public protocol rather than a vendor
    product contract, so this harvesting surface is treated as
    institution-operated. The vendor's own REST contract on the same deployment
    is recorded separately below as x-operator: tenant.
  description: >-
    Keyless, anonymous OAI-PMH 2.0 metadata harvesting for UCD's open-access
    institutional repository. Verified live 2026-08-30: all six verbs return HTTP
    200 with a well-formed envelope, ListIdentifiers reports completeListSize
    17167, earliestDatestamp is 2007-08-22, granularity is
    YYYY-MM-DDThh:mm:ssZ, and fourteen metadata formats are advertised (oai_dc,
    qdc, dim, didl, mets, mods, ore, rdf, marc, marc21, etdms, uketd_dc,
    rian_dc, rms_oai — rian_dc for the Irish national aggregator RIAN, uketd_dc
    and etdms for theses). A second base URL, /server/oai/openairecris, serves
    the OpenAIRE Guidelines for CRIS Managers 1.1 CERIF profile. Protocol errors
    behave correctly: badVerb, cannotDisseminateFormat and idDoesNotExist are
    returned inside HTTP 200 envelopes. Records carry Handle identifiers under
    UCD's prefix 10197 and, in the dim format, qualified ORCID fields. NOTE the
    base URL: the /oai/request path recorded in this file in June 2026 returns
    405; the working path is /server/oai/request. The OpenAPI below is DERIVED by
    API Evangelist from live probes — UCD publishes none.
  humanURL: https://libguides.ucd.ie/RRU/usage
  baseURL: https://researchrepository.ucd.ie/server/oai/request
