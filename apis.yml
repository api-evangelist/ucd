---
aid: ucd
name: University College Dublin
description: >-
  University College Dublin is Ireland's largest university, a public research
  institution in Belfield, Dublin. It operates no API programme: there is no
  developer portal, no API key issuance, no OAuth authorization server and no
  first-party OpenAPI anywhere on a ucd.ie host. What it does operate, verified
  live on 2026-08-30, is three real machine-readable surfaces — an OAI-PMH 2.0
  harvesting endpoint for Research Repository UCD (17,167 records, fourteen
  metadata formats, plus an OpenAIRE CRIS base URL), a SAML 2.0 Shibboleth
  Identity Provider registered in Edugate/eduGAIN as
  https://sso.ucd.ie/idp/shibboleth with scope ucd.ie, and static Dublin Core
  collection data exports from the UCD Digital Library. Everything else is
  somebody else's engineering under UCD's name: the repository platform is
  DSpace-CRIS hosted by 4Science, library discovery is Serials Solutions, and
  the Dúchas API for the National Folklore Collection — the collection is UCD's,
  the platform is DCU's — was withdrawn by its operator and now returns HTTP 500
  on every path. This profile was re-run under the university pipeline on
  2026-08-30 and the previously catalogued Dúchas contracts were removed.
