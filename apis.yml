- aid: ucd:dspace-rest
  name: Research Repository UCD — DSpace-CRIS REST API (4Science)
  x-operator: tenant
  x-operator-evidence: >-
    researchrepository.ucd.ie CNAMEs to ucd7.4science.cloud ->
    ucd-researchrepository.prod.4science.cloud. The REST root reports
    dspaceVersion "DSpace 7.6.1" and crisVersion "cris-2023.02.05". The
    interface, its ~90 HAL link relations and its error vocabulary are upstream
    DSpace-CRIS's, shipped identically to every 4Science customer.
  description: >-
    A live DSpace-CRIS 7.6.1 HAL REST API on UCD's branded repository host,
    advertising roughly ninety link relations including items, collections,
    communities, discover, authn, oidc, orcidqueues, orcidhistories, versions and
    usagereports. The DATA is UCD's; the CONTRACT is DSpace's and 4Science's. No
    specification for it is saved in this repository, and none should be — it
    would credit UCD with a vendor's engineering and would be the same document
    every other 4Science institution ships. Recorded here because the tenant
    relationship is a real institutional fact. PROBING NOTE: the repository's
    human-facing Angular UI is behind a bot challenge — every HTML path,
    including the site root and item handle pages, returns HTTP 405 with a
    "Human Verification" body to scripted clients. That is bot-blocked, not
    dead; the /server/api and /server/oai paths answer normally.
  humanURL: https://researchrepository.ucd.ie/
  baseURL: https://researchrepository.ucd.ie/server/api
