- aid: ucd:digital-library-data
  name: UCD Digital Library collection data exports
  x-operator: institution
  x-operator-evidence: >-
    digital.ucd.ie resolves to 193.1.173.9 — a HEAnet/UCD address, no vendor
    CNAME. The site identifies itself as UCD Library's own service, contactable
    at digital.library@ucd.ie.
  description: >-
    Static, keyless Dublin Core metadata exports for UCD Library's digital
    cultural-heritage collections — metadata as CSV and JSON, plus facets,
    subjects and a TimelineJS export, all linked from a published Data page.
    Files rather than an API, and small: the metadata export was 2.2KB on
    2026-08-30. This is what remains after a platform decommissioning. The
    IIIF Image API 2.0, IIIF Presentation API 2.0, Geospatial Data API and
    unAPI endpoint catalogued here in June 2026 NO LONGER EXIST — digital.ucd.ie
    /help/, /api, /iiif and /view/ all return 404, and the site now states it is
    a "temporary access website" pending procurement of a new digital library
    access and preservation platform in 2026, built in the meantime on
    CollectionBuilder-CSV. Those two entries have been replaced by this one.
  humanURL: https://digital.ucd.ie/data.html
  baseURL: https://digital.ucd.ie
