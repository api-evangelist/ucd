- aid: ucd:duchas
  name: Dúchas API — National Folklore Collection (operated by DCU)
  x-operator: tenant
  x-operator-evidence: >-
    Host www.duchas.ie is not under ucd.ie. The API documentation at
    docs.gaois.ie is published by the Gaois research group, Fiontar & Scoil na
    Gaeilge, Dublin City University, and directs API feedback to gaois@dcu.ie;
    the spec previously held here carried info.contact "Gaois / Dúchas"
    <eolas@duchas.ie> and servers https://www.duchas.ie/api/v0.5. UCD's role is
    custodian of the collection — the documentation directs data-dump requests to
    the NFC at bealoideas@ucd.ie.
  description: >-
    The National Folklore Collection (Cnuasach Bhéaloideas Éireann) is held at
    UCD; the Dúchas digitisation platform and its API are built and operated by
    DCU's Gaois research group. THE API IS WITHDRAWN. Verified 2026-08-30:
    https://www.duchas.ie/api/v0.5/api, /api/v0.6/api, /api and /api/v0.5/cbes
    all return HTTP 500 IIS error pages, and the v0.6 documentation states in its
    own words that this "is a prerelease version of the Dúchas API that is no
    longer available", with a v1.0 release pending and data dumps available on
    request in the interim. The June 2026 profile read that 500 as "live but
    gated" and saved six per-tag OpenAPIs plus twelve collections and their
    derived schemas, structures, examples, rules, vocabulary, JSON-LD and
    agentic-access files under UCD's slug — thirty-four files describing another
    university's contract for an endpoint that does not answer. All of them were
    removed on 2026-08-30. The relationship is kept; the contract is not.
  humanURL: https://www.duchas.ie/en
  tags:
  - Cultural Heritage
  - Folklore
  - Tenant
  - Withdrawn
  - Ireland
  properties:
  - type: Documentation
    url: https://docs.gaois.ie/en/data/duchas/v0.6/api
  - type: Website
